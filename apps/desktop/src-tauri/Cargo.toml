[package]
name = "iris-prototype"
version = "0.1.0"
description = "Iris Prototype — voice-first desktop assistant"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.54.1", features = ["sync", "time", "process", "io-util", "rt-multi-thread", "macros"] }
reqwest = { version = "=0.13.5", features = ["json", "stream"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
security-framework = "=3.7.0"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
